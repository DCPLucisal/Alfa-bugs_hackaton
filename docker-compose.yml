version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tatinkom92 
      POSTGRES_DB: alfa_data        
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql 
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql

  app:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=alfa_data           
      - DB_USER=postgres
      - DB_PASSWORD=Tatinkom92       
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  pgdata: